{% extends "base.html" %}
{% block title %}Nouveau mot de passe — Let's Meet Morocco{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div style="text-align:center;margin-bottom:22px">
      <img src="{{ url_for('static',filename='img/logo.png') }}" alt="Let's Meet Morocco"
           style="height:48px;object-fit:contain;mix-blend-mode:multiply">
    </div>
    <div style="text-align:center;margin-bottom:18px">
      <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto">🔑</div>
    </div>
    <h1 style="text-align:center;font-family:'Syne',sans-serif;font-size:20px;margin-bottom:6px">Nouveau mot de passe</h1>
    <p class="sub">Choisis un nouveau mot de passe sécurisé.</p>

    {% if error %}
    <div class="alert alert-error" style="margin:0 0 14px">{{error}}</div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{csrf_token}}">
      <div class="form-group">
        <label>Nouveau mot de passe <span style="font-size:11px;color:#999">(6 caractères minimum)</span></label>
        <input type="password" name="password" minlength="6" oninput="checkMdp(this)" required autofocus>
        <div id="mdp-hint" style="font-size:12px;margin-top:4px"></div>
      </div>
      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" name="confirm" minlength="6" required
               oninput="checkConfirm(this)">
        <div id="confirm-hint" style="font-size:12px;margin-top:4px"></div>
      </div>
      <button class="btn btn-green" style="width:100%;font-family:'Syne',sans-serif;font-size:15px;padding:12px;border-radius:12px">
        ✅ Enregistrer le nouveau mot de passe
      </button>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function checkConfirm(inp) {
  const h = document.getElementById('confirm-hint');
  if(!h) return;
  const p = document.querySelector('[name="password"]');
  if(inp.value.length === 0) { h.textContent=''; return; }
  if(p && inp.value === p.value) {
    h.textContent = '✅ Les mots de passe correspondent';
    h.style.color = '#2DB54C';
  } else {
    h.textContent = '❌ Ne correspondent pas';
    h.style.color = '#E84545';
  }
}
</script>
{% endblock %}
