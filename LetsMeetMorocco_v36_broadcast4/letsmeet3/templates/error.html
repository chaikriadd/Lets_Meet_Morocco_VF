<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{code}} — Let's Meet Morocco</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#0D2B12 0%,#0a1f2e 50%,#1a0a2e 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(45,181,76,.15),transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(0,180,216,.12),transparent 60%)}
.card{position:relative;z-index:1;text-align:center;max-width:460px;padding:48px 40px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;backdrop-filter:blur(20px)}
.icon{font-size:64px;margin-bottom:16px;display:block}
.code{font-family:'Syne',sans-serif;font-size:80px;font-weight:800;line-height:1;background:linear-gradient(135deg,#E8541A,#F5A623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:12px;color:#fff}
p{font-size:15px;color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:28px}
.btn-home{display:inline-block;background:linear-gradient(135deg,#E8541A,#F5A623);color:#fff;padding:13px 28px;border-radius:12px;text-decoration:none;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin:4px;box-shadow:0 6px 24px rgba(232,84,26,.35)}
.btn-back{display:inline-block;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);padding:13px 28px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;margin:4px;border:1px solid rgba(255,255,255,.15)}
.logo{display:flex;align-items:center;justify-content:center;margin-bottom:28px}
.logo img{height:36px;filter:brightness(0) invert(1);opacity:.8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/static/img/logo.png" alt="Let's Meet Morocco">
  </div>
  <span class="icon">{{icon}}</span>
  <div class="code">{{code}}</div>
  <h1>{{titre}}</h1>
  <p>{{message}}</p>
  <div>
    <a href="/" class="btn-home">🏠 Retour à l'accueil</a>
    <a href="javascript:history.back()" class="btn-back">← Page précédente</a>
  </div>
  {% if code == 500 %}
  <div style="margin-top:20px;font-size:12px;color:rgba(255,255,255,.35)">
    Si le problème persiste, contacte <strong>admin@letsmeet.ma</strong>
  </div>
  {% endif %}
</div>
</body>
</html>
