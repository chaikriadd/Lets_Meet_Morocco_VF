<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Let's Meet Morocco</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;
  justify-content:center;background:#F4F6F8;position:relative}

/* Fond subtil avec couleurs du logo */
body::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 20% 30%,rgba(232,84,26,.06),transparent 55%),
             radial-gradient(ellipse at 80% 70%,rgba(0,180,216,.05),transparent 55%),
             radial-gradient(ellipse at 50% 50%,rgba(45,181,76,.04),transparent 60%)}

.box{
  background:#fff;border-radius:20px;padding:40px;width:420px;max-width:95vw;
  box-shadow:0 4px 32px rgba(0,0,0,.1);border:1px solid #E8EDE9;
  position:relative;z-index:1;
}

/* Logo dans la box */
.box-logo{text-align:center;margin-bottom:28px}
.box-logo img{height:42px;object-fit:contain}

/* Badge Administration */
.admin-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(232,84,26,.08);border:1px solid rgba(232,84,26,.2);
  color:#E8541A;font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:5px 14px;border-radius:20px;
  margin-bottom:16px;
}

h1{font-family:'Syne',sans-serif;font-size:21px;font-weight:800;
  color:#0F1A10;margin-bottom:6px;text-align:center}
.sub{font-size:13px;color:#8A9490;text-align:center;margin-bottom:24px}

.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;
  margin-bottom:6px;color:#424242}
.form-group input{
  width:100%;padding:10px 14px;border:1.5px solid #E8EDE9;border-radius:10px;
  font-size:14px;font-family:'DM Sans',sans-serif;transition:border .2s;
  background:#fff;color:#0F1A10;outline:none;
}
.form-group input:focus{border-color:#E8541A;box-shadow:0 0 0 3px rgba(232,84,26,.1)}

.btn-login{
  width:100%;padding:13px;background:linear-gradient(135deg,#0D2B12,#0a1f2e);
  color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;
  border:none;border-radius:12px;cursor:pointer;transition:all .2s;
  letter-spacing:.3px;
}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}

.alert-error{
  background:#FEECEC;color:#B91C1C;border-left:4px solid #E84545;
  padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;
}

.back-link{
  text-align:center;margin-top:16px;font-size:12px;color:#aaa;
}
.back-link a{color:#8A9490;text-decoration:none}
.back-link a:hover{color:#0F1A10}

/* Ligne décorative bas */
.box::after{
  content:'';position:absolute;bottom:0;left:20px;right:20px;height:2px;
  border-radius:0 0 2px 2px;
  background:linear-gradient(90deg,#E8541A,#00B4D8,#2DB54C,#F5A623);
}

/* Sécurité notice */
.security-note{
  margin-top:14px;padding:10px 14px;background:#F9FAFB;
  border-radius:8px;font-size:11px;color:#aaa;text-align:center;
  border:1px solid #F0F0F0;line-height:1.6;
}
</style>
</head>
<body>
<div class="box">
  <div class="box-logo">
    <img src="/static/img/logo.png" alt="Let's Meet Morocco">
  </div>

  <div style="text-align:center">
    <span class="admin-badge">🔑 Administration</span>
  </div>

  <h1>Accès sécurisé</h1>
  <p class="sub">Panel d'administration Let's Meet Morocco</p>

  {% if error %}
  <div class="alert-error">{{error}}</div>
  {% endif %}

  <form method="POST" autocomplete="off">
    <!-- Champ honeypot pour bloquer l'autocomplétion du navigateur -->
    <input type="text" name="fake_user" style="display:none" tabindex="-1" autocomplete="off">
    <input type="password" name="fake_pass" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{csrf_token}}">
    <div class="form-group">
      <label>Email administrateur</label>
      <input type="email" name="email" placeholder="admin@letsmeet.ma"
             required autofocus autocomplete="new-password"
             onfocus="this.removeAttribute('readonly')" readonly>
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" name="password" placeholder="••••••••••"
             required autocomplete="new-password"
             onfocus="this.removeAttribute('readonly')" readonly>
    </div>
    <button type="submit" class="btn-login">
      Accéder au panel →
    </button>
  </form>

  <div class="back-link">
    <a href="/login">← Retour à l'espace utilisateur</a>
  </div>

  <div class="security-note">
    🔒 Accès réservé aux administrateurs autorisés.<br>
    Toutes les connexions sont enregistrées.
  </div>
</div>
<script>
// Forcer la suppression de l'autocomplétion au chargement
document.addEventListener('DOMContentLoaded', function() {
  // Vider les champs après que le navigateur les ait remplis
  setTimeout(function() {
    const emailField = document.querySelector('input[name="email"]');
    const pwdField   = document.querySelector('input[name="password"]');
    if (emailField && emailField.value && !emailField.dataset.userTyped) {
      emailField.value = '';
    }
    if (pwdField && pwdField.value && !pwdField.dataset.userTyped) {
      pwdField.value = '';
    }
  }, 100);
  // Marquer les champs que l'utilisateur remplit lui-même
  document.querySelectorAll('input').forEach(function(inp) {
    inp.addEventListener('input', function() {
      this.dataset.userTyped = 'true';
    });
  });
});
</script>
</body>
</html>
